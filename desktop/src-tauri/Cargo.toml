[package]
name = "nanobot-desktop"
version = "0.1.0"
description = "NextTutorBot Desktop Application"
authors = ["nanobot contributors"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
url = "2"
urlencoding = "2.1"

