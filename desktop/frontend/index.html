<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextTutorBot</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --border-color: #30363d;
        --text-primary: #e6edf3;
        --text-secondary: #8b949e;
        --accent: #58a6ff;
        --danger: #f85149;
        --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        padding: 24px;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 540px;
        width: 100%;
        text-align: center;
      }

      .logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(88, 166, 255, 0.2);
        border-radius: 50%;
        border-top-color: var(--accent);
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
        letter-spacing: -0.01em;
      }

      .status-text {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 16px;
      }

      .error-card {
        display: none;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 16px;
        width: 100%;
        text-align: left;
        margin-top: 16px;
      }

      .error-header {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--danger);
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 8px;
      }

      .error-body {
        font-size: 13px;
        color: var(--text-primary);
        line-height: 1.5;
        margin-bottom: 12px;
        word-break: break-word;
      }

      .log-path {
        font-family: var(--font-mono);
        font-size: 11px;
        background-color: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 8px;
        color: var(--text-secondary);
        word-break: break-all;
        margin-bottom: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-primary);
        background-color: #21262d;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .btn:hover {
        background-color: #30363d;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="logo.png" class="logo" alt="NextTutorBot" />
      <div id="loader" class="spinner"></div>
      <h1 class="title">NextTutorBot</h1>
      <p id="status-message" class="status-text">Starting NextTutorBot gateway…</p>

      <div id="error-card" class="error-card">
        <div class="error-header">
          <span>Failed to start gateway</span>
        </div>
        <div id="error-message" class="error-body"></div>
        <div id="log-section" style="display: none;">
          <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;">Log file:</div>
          <div id="log-path" class="log-path"></div>
        </div>
        <div style="display: flex; gap: 8px; justify-content: flex-end;">
          <button id="btn-open-log" class="btn" onclick="handleOpenLog()">Open log</button>
          <button id="btn-retry" class="btn" onclick="handleRetry()">Retry</button>
        </div>
      </div>
    </div>

    <script>
      function handleOpenLog() {
        if (window.__TAURI__ && window.__TAURI__.core) {
          window.__TAURI__.core.invoke("open_log_file").catch(function (e) {
            console.error("Failed to open log:", e);
          });
        }
      }

      function handleRetry() {
        window.__resetSplash();
        if (window.__TAURI__ && window.__TAURI__.core) {
          window.__TAURI__.core.invoke("retry_gateway").catch(function (e) {
            window.__showError(e);
          });
        } else {
          location.reload();
        }
      }

      window.__resetSplash = function () {
        var loader = document.getElementById("loader");
        var statusMsg = document.getElementById("status-message");
        var errorCard = document.getElementById("error-card");

        if (loader) loader.style.display = "block";
        if (statusMsg) statusMsg.textContent = "Starting Nanobot gateway…";
        if (errorCard) errorCard.style.display = "none";
      };

      window.__showError = function (message, logPath) {
        var loader = document.getElementById("loader");
        var statusMsg = document.getElementById("status-message");
        var errorCard = document.getElementById("error-card");
        var errorMsg = document.getElementById("error-message");
        var logSection = document.getElementById("log-section");
        var logPathEl = document.getElementById("log-path");

        if (loader) loader.style.display = "none";
        if (statusMsg) statusMsg.textContent = "Gateway failed to start";
        if (errorMsg) errorMsg.textContent = message || "An unexpected error occurred.";
        if (logPath && logPath.length > 0) {
          if (logPathEl) logPathEl.textContent = logPath;
          if (logSection) logSection.style.display = "block";
        }
        if (errorCard) errorCard.style.display = "block";
      };
    </script>
  </body>
</html>
