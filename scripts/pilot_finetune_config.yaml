model_name_or_path: "Qwen/Qwen3-4B-Instruct"
output_dir: "/tmp/qwen3-4b-pilot-merged"
final_gguf_path: "~/.nanobot/models/qwen3-4b-pilot-q5_k_m.gguf"
llama_cpp_path: "~/.nanobot/llama.cpp/"

dataset:
  train_file: "~/.nanobot/pilot/sft_train.jsonl"
  val_file: "~/.nanobot/pilot/curated/val.jsonl"

lora:
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  max_seq_length: 4096
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  num_train_epochs: 3
  warmup_ratio: 0.03
  logging_steps: 10
  eval_steps: 100
  save_steps: 500

quantization:
  method: "q5_k_m"
